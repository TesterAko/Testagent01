      <script>
        if ("serviceWorker" in navigator)
        {
          window.addEventListener('load', function ()
          {
            navigator.serviceWorker.register("sw.js").then(
              function (erfolg)
              {
                console.log("ServiceWorker wurde registriert.", erfolg);
              }
            ).catch(
              function (fehler)
              {
                console.log("ServiceWorker wurde leider nicht registriert.", fehler);
              }
            );
          });

        }
        const cssFiles = document.querySelectorAll('link[rel="preload"]');
        const scripts = document.querySelectorAll('script');

        const loadedFiles = []



        let trackLoading = cssFiles.length + scripts.length - 1;



        scripts.forEach(script =>
        {
          script.addEventListener("load", () =>
          {
            if (!loadedFiles.includes(script))
            {
              trackLoading -= 1;
              loadedFiles.push(script)
            }

          })
        })


        cssFiles.forEach(cssFile =>
        {
          cssFile.addEventListener("load", () =>
          {
            if (!loadedFiles.includes(cssFile))
            {
              trackLoading -= 1;
              loadedFiles.push(cssFile)
            }
          })
        })

        const progressBar = document.querySelector(".loadingProgress")
        const stepsize = 100 / trackLoading;
        const progressBarTimer = setInterval(() =>
        {
          progressBar.style.width = `${stepsize * loadedFiles.length}%`
          if (trackLoading === 0) clearInterval(progressBarTimer)

        }, 200)
      </script>
